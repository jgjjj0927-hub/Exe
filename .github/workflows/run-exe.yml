name: Run EXE
on: [push, workflow_dispatch]

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Locate exe
        id: locate
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse -Filter CatCryptBuilder.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host ERROR: CatCryptBuilder.exe not found
            exit 1
          }
          Write-Host Found: $($exe.FullName)
          Write-Host Size: $($exe.Length) bytes
          $line = 'exe_path=' + $exe.FullName
          $line | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run executable
        shell: powershell
        run: |
          $exePath = '${{ steps.locate.outputs.exe_path }}'
          $outFile = Join-Path $PWD stdout.txt
          $errFile = Join-Path $PWD stderr.txt

          Write-Host Launching: $exePath

          $p = Start-Process -FilePath $exePath -PassThru -WindowStyle Hidden -RedirectStandardOutput $outFile -RedirectStandardError $errFile

          $exited = $p.WaitForExit(120000)

          if (-not $exited) {
            Write-Host Process still running after 120s - likely GUI wait. Killing.
            try { $p.Kill($true) } catch { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          } else {
            Write-Host Exit code: $($p.ExitCode)
          }

          Write-Host === STDOUT ===
          if (Test-Path $outFile) { Get-Content $outFile -Raw }

          Write-Host === STDERR ===
          if (Test-Path $errFile) { Get-Content $errFile -Raw }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-run-logs
          path: |
            stdout.txt
            stderr.txt
          if-no-files-found: ignore
